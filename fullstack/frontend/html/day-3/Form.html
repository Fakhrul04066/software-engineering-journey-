<!DOCTYPE html>
<html>
<head>
    <title>Basic Form</title>
</head>

<body>

    <h2>Registration Form</h2>

    <form action="/server">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Write your name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Write your email" required>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <br><br>

        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="Bangladesh">Bangladesh</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="Japan">Japan</option>
        </select>
        <br><br>

        <label for="message">Message:</label>
        <br>
        <textarea id="message" name="message" rows="4" cols="30" placeholder="Write your message"></textarea>
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>


    <h3>Search Anything on YouTube</h3>

    <form action="https://www.youtube.com/results">

        <input type="search" id="search" name="search_query" placeholder="Search on YouTube">

        <button type="submit">Submit</button>

    </form>

</body>
</html>
